<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Matrix Rain — WebGPU + TSL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #00ff70;
    }

    #rain-host {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* ── Controls panel ──────────────────────────────────────────── */
    #controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #00ff70;
      padding: 14px 16px;
      min-width: 220px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      font-size: 11px;
      letter-spacing: 0.07em;
      line-height: 1.9;
    }

    #controls summary {
      cursor: pointer;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #00ff70;
      list-style: none;
      user-select: none;
    }
    #controls summary::before { content: '▶ '; }
    details[open] summary::before { content: '▼ '; }

    #controls label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
      color: #7fffaa;
    }

    #controls input[type="range"] {
      width: 90px;
      accent-color: #00ff70;
    }
    #controls input[type="color"] {
      width: 32px;
      height: 18px;
      padding: 0;
      border: 1px solid #00ff70;
      background: transparent;
      cursor: pointer;
    }
    #controls input[type="checkbox"] {
      accent-color: #00ff70;
    }
    #controls select {
      background: #111;
      color: #00ff70;
      border: 1px solid #00ff70;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      padding: 1px 4px;
      cursor: pointer;
      max-width: 90px;
    }
    #controls input[type="number"] {
      width: 46px;
      background: #111;
      color: #00ff70;
      border: 1px solid #00ff7055;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      padding: 1px 3px;
      -moz-appearance: textfield;
    }
    #controls input[type="number"]::-webkit-outer-spin-button,
    #controls input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    /* ── Mobile ─────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    #controls {
      top: auto;
      bottom: 0;
      right: 0;
      left: 0;
      max-height: 60vh;
      min-width: unset;
      border-top: 1px solid #00ff70;
      border-left: none;
      border-right: none;
      border-bottom: none;
      font-size: 13px;
      line-height: 2.0;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    #controls summary {
      font-size: 12px;
      padding: 4px 0;
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    #controls label {
      min-height: 36px;
    }
    #controls input[type="range"] {
      width: 130px;
      height: 22px;
    }
    #controls input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    #controls input[type="color"] {
      width: 44px;
      height: 28px;
    }
    #controls select {
      font-size: 12px;
      max-width: 120px;
      padding: 4px 6px;
      min-height: 28px;
    }
    #controls input[type="number"] {
      font-size: 12px;
      width: 54px;
      padding: 2px 4px;
      min-height: 28px;
    }
    #hint { display: none; }
  }

  #no-webgpu {
      position: fixed;
      inset: 0;
      background: #000;
      color: #f00;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 16px;
      font-family: monospace;
      z-index: 9999;
    }
    #no-webgpu.hidden { display: none; }

    #hint {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 10px;
      color: rgba(0, 255, 112, 0.35);
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    /* ── CCP easter egg DOM elements ─────────────────────────────── */
    #ccp-hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(0,0,0,0.82);
      border-bottom: 1px solid #DE2910;
      color: #ff4040;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    #ccp-tint {
      position: fixed;
      inset: 0;
      background: rgba(222, 41, 16, 0.06);
      pointer-events: none;
      z-index: 10;
    }

    .ccp-sweep {
      position: fixed;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right,
        transparent 0%, rgba(222,41,16,0.7) 15%, rgba(222,41,16,0.7) 85%, transparent 100%);
      pointer-events: none;
      z-index: 15;
      top: -4px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
      "three/webgpu":   "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
      "three/tsl":      "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div id="no-webgpu" class="hidden">
  <strong>WebGPU and WebGL2 unavailable</strong>
  <small>Try Chrome 113+, Edge 113+, or Firefox 120+ with a compatible GPU</small>
</div>

<!-- CCP easter egg DOM overlay elements (hidden until activated) -->
<div id="ccp-hud" style="display:none">
  <span id="ccp-hud-left">&#x2682; CAM-01 &middot; <span id="ccp-rec">&#x25CF;REC</span></span>
  <span id="ccp-hud-center">SOCIAL CREDIT: <span id="ccp-score">---</span></span>
  <span id="ccp-coords">(X:0000 Y:0000) &middot; <span id="ccp-time">--:--:--</span></span>
  <span style="margin-left:8px;">&#x2682;</span>
</div>
<div id="ccp-tint" style="display:none"></div>
<div class="ccp-sweep" id="ccp-sweep-0" style="display:none"></div>
<div class="ccp-sweep" id="ccp-sweep-1" style="display:none"></div>

<div id="rain-host"></div>

<details id="controls">
  <summary>Matrix Rain</summary>
  <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">

    <label>Post-processing
      <select id="ctl-ppmode">
        <option value="rain" selected>rain</option>
        <option value="crt">crt</option>
        <option value="none">none (diagnostic)</option>
      </select>
    </label>

    <label>Preset
      <select id="ctl-preset">
        <option value="">— custom —</option>
        <option value="matrix1999">matrix1999</option>
        <option value="ghost">ghost</option>
        <option value="overdrive">overdrive</option>
        <option value="default">default</option>
      </select>
    </label>

    <label>Color 1
      <input id="ctl-color" type="color" value="#00ff70">
    </label>

    <label>Color 2
      <input id="ctl-color2" type="color" value="#00ff70">
    </label>

    <label>Opacity
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-opacity"     type="range"  min="0" max="1"    step="0.01"   value="0.82">
        <input id="ctl-opacity-num" type="number" min="0" max="1"    step="0.01"   value="0.82">
      </span>
    </label>

    <label>Depth (POM)
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-depth"     type="range"  min="0" max="0.15"  step="0.005"  value="0.04">
        <input id="ctl-depth-num" type="number" min="0" max="0.15"  step="0.005"  value="0.04">
      </span>
    </label>

    <label>Normal Str
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-normal"     type="range"  min="0" max="12"   step="0.5"    value="6">
        <input id="ctl-normal-num" type="number" min="0" max="12"   step="0.5"    value="6">
      </span>
    </label>

    <label>Sway
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-sway"     type="range"  min="0" max="0.15"  step="0.005"  value="0.04">
        <input id="ctl-sway-num" type="number" min="0" max="0.15"  step="0.005"  value="0.04">
      </span>
    </label>

    <label>Soften
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-soften"     type="range"  min="0" max="0.01"  step="0.0005" value="0.002">
        <input id="ctl-soften-num" type="number" min="0" max="0.01"  step="0.0005" value="0.002">
      </span>
    </label>

    <label>Heat shimmer
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-heat"     type="range"  min="0" max="0.012" step="0.0005" value="0.004">
        <input id="ctl-heat-num" type="number" min="0" max="0.012" step="0.0005" value="0.004">
      </span>
    </label>

    <label>Lens streaks
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-streaks"     type="range"  min="0" max="0.2"   step="0.005"  value="0.055">
        <input id="ctl-streaks-num" type="number" min="0" max="0.2"   step="0.005"  value="0.055">
      </span>
    </label>

    <label>Speed
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-speed"     type="range"  min="0.1" max="2.0" step="0.05"   value="1">
        <input id="ctl-speed-num" type="number" min="0.1" max="2.0" step="0.05"   value="1">
      </span>
    </label>

    <label>Bloom strength
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-bloom"     type="range"  min="0" max="3"     step="0.05"   value="1.15">
        <input id="ctl-bloom-num" type="number" min="0" max="3"     step="0.05"   value="1.15">
      </span>
    </label>

    <label>Bloom threshold
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-bloom-thr"     type="range"  min="0" max="0.5"  step="0.005"  value="0.2">
        <input id="ctl-bloom-thr-num" type="number" min="0" max="0.5"  step="0.005"  value="0.2">
      </span>
    </label>

    <label>Phosphor decay
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-phosphor"     type="range"  min="0" max="0.99"  step="0.01"   value="0.88">
        <input id="ctl-phosphor-num" type="number" min="0" max="0.99"  step="0.01"   value="0.88">
      </span>
    </label>

    <label>God rays
      <input id="ctl-godrays" type="checkbox" checked>
    </label>

    <label>GR light X
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-lx"     type="range"  min="0" max="1" step="0.01" value="0.5">
        <input id="ctl-gr-lx-num" type="number" min="0" max="1" step="0.01" value="0.5">
      </span>
    </label>

    <label>GR light Y
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-ly"     type="range"  min="0" max="1" step="0.01" value="0.75">
        <input id="ctl-gr-ly-num" type="number" min="0" max="1" step="0.01" value="0.75">
      </span>
    </label>

    <label>GR density
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-density"     type="range"  min="0" max="1" step="0.01" value="0.93">
        <input id="ctl-gr-density-num" type="number" min="0" max="1" step="0.01" value="0.93">
      </span>
    </label>

    <label>GR decay
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-decay"     type="range"  min="0" max="1" step="0.01" value="0.33">
        <input id="ctl-gr-decay-num" type="number" min="0" max="1" step="0.01" value="0.33">
      </span>
    </label>

    <label>GR weight
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-weight"     type="range"  min="0" max="1" step="0.01" value="0.35">
        <input id="ctl-gr-weight-num" type="number" min="0" max="1" step="0.01" value="0.35">
      </span>
    </label>

    <label>GR exposure
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-gr-exposure"     type="range"  min="0" max="2" step="0.01" value="0.45">
        <input id="ctl-gr-exposure-num" type="number" min="0" max="2" step="0.01" value="0.45">
      </span>
    </label>

    <label>Burst bloom
      <input id="ctl-burst" type="checkbox" checked>
    </label>

    <label>Flat Z (2D plane)
      <input id="ctl-flatz" type="checkbox">
    </label>

    <label>Max yaw (°)
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-yaw"     type="range"  min="0" max="180"    step="1"    value="180">
        <input id="ctl-yaw-num" type="number" min="0" max="180"    step="1"    value="180">
      </span>
    </label>

    <label>Facing jitter
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-jitter"     type="range"  min="0" max="1.5708" step="0.01" value="0.1745">
        <input id="ctl-jitter-num" type="number" min="0" max="1.5708" step="0.01" value="0.1745">
      </span>
    </label>

    <label>Glyph chroma
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-chroma-scale"     type="range"  min="0" max="3" step="0.05" value="1">
        <input id="ctl-chroma-scale-num" type="number" min="0" max="3" step="0.05" value="1">
      </span>
    </label>

    <label>Vignette
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-vignette"     type="range"  min="0" max="1"    step="0.01"  value="0.42">
        <input id="ctl-vignette-num" type="number" min="0" max="1"    step="0.01"  value="0.42">
      </span>
    </label>

    <label>Scanlines
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-scanlines"     type="range"  min="0" max="0.2"  step="0.005" value="0.045">
        <input id="ctl-scanlines-num" type="number" min="0" max="0.2"  step="0.005" value="0.045">
      </span>
    </label>

    <label>Holo aberration
      <span style="display:flex;align-items:center;gap:4px;">
        <input id="ctl-holo-aber"     type="range"  min="0" max="0.015" step="0.0005" value="0.0025">
        <input id="ctl-holo-aber-num" type="number" min="0" max="0.015" step="0.0005" value="0.0025">
      </span>
    </label>

    <label>Char set
      <select id="ctl-charset">
        <option value="matrixcode" selected>matrixcode</option>
        <option value="matrix1999">matrix1999</option>
        <option value="latin">latin</option>
        <option value="ascii">ascii</option>
        <option value="cyber">cyber</option>
        <option value="cyrillic">cyrillic</option>
        <option value="japanese">japanese</option>
        <option value="chinese">chinese</option>
        <option value="orbitron">orbitron</option>
        <option value="iosevka">iosevka</option>
        <option value="datatype">datatype</option>
        <option value="gsanscode">gsanscode</option>
      </select>
    </label>

    <!-- Message reveal sub-panel -->
    <div style="border-top:1px solid #00ff7044;margin-top:4px;padding-top:4px;
                display:flex;flex-direction:column;gap:4px;">
      <label style="color:#7fffaa;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">
        — Message —
      </label>
      <label>Text
        <input id="ctl-msg-text" type="text" value="WAKE UP"
               style="background:#111;color:#00ff70;border:1px solid #00ff70;
                      font-family:'Courier New',monospace;font-size:10px;width:90px;padding:1px 4px;">
      </label>
      <label>Band suppress
        <input id="ctl-msg-band-suppress" type="checkbox">
      </label>
      <label>Boost
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-boost"     type="range"  min="1" max="6"  step="0.1" value="2">
          <input id="ctl-msg-boost-num" type="number" min="1" max="6"  step="0.1" value="2">
        </span>
      </label>
      <label>Spawn %
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-spawn"     type="range"  min="0" max="1" step="0.05" value="0.85">
          <input id="ctl-msg-spawn-num" type="number" min="0" max="1" step="0.05" value="0.85">
        </span>
      </label>
      <label>Hitbox min
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-tolmult-min"     type="range"  min="1" max="60" step="1" value="4">
          <input id="ctl-msg-tolmult-min-num" type="number" min="1" max="60" step="1" value="4">
        </span>
      </label>
      <label>Hitbox max
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-tolmult-max"     type="range"  min="1" max="100" step="1" value="18">
          <input id="ctl-msg-tolmult-max-num" type="number" min="1" max="100" step="1" value="18">
        </span>
      </label>
      <label>Min depth
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-tolscale"     type="range"  min="0.5" max="3.0" step="0.1" value="1.3">
          <input id="ctl-msg-tolscale-num" type="number" min="0.5" max="3.0" step="0.1" value="1.3">
        </span>
      </label>
      <label>Reveal s
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-reveal"     type="range"  min="0.3" max="6" step="0.1" value="2">
          <input id="ctl-msg-reveal-num" type="number" min="0.3" max="6" step="0.1" value="2">
        </span>
      </label>
      <label>Hold s
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-hold"     type="range"  min="0" max="10" step="0.5" value="3">
          <input id="ctl-msg-hold-num" type="number" min="0" max="10" step="0.5" value="3">
        </span>
      </label>
      <label>Fade s
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-msg-fade"     type="range"  min="0.2" max="3" step="0.1" value="1">
          <input id="ctl-msg-fade-num" type="number" min="0.2" max="3" step="0.1" value="1">
        </span>
      </label>
      <label style="justify-content:center;gap:4px;">
        <button id="ctl-msg-show"
                style="background:#111;color:#00ff70;border:1px solid #00ff70;
                       font-family:'Courier New',monospace;font-size:10px;cursor:pointer;
                       padding:2px 8px;">
          SHOW
        </button>
        <button id="ctl-msg-clear"
                style="background:#111;color:#00ff70;border:1px solid #00ff70;
                       font-family:'Courier New',monospace;font-size:10px;cursor:pointer;
                       padding:2px 8px;">
          CLEAR
        </button>
      </label>
    </div>

    <!-- Animation sub-panel -->
    <div style="border-top:1px solid #00ff7044;margin-top:4px;padding-top:4px;
                display:flex;flex-direction:column;gap:4px;">
      <label style="color:#7fffaa;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">
        — Animation —
      </label>
      <label>Freeze
        <input id="ctl-frozen" type="checkbox">
      </label>
      <label>Reduced motion
        <input id="ctl-reduced-motion" type="checkbox">
      </label>
      <label>Glitch intensity
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-glitch-int"     type="range"  min="0.05" max="1" step="0.05" value="0.6">
          <input id="ctl-glitch-int-num" type="number" min="0.05" max="1" step="0.05" value="0.6">
        </span>
      </label>
      <label>Glitch duration s
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-glitch-dur"     type="range"  min="0.1" max="2" step="0.1" value="0.4">
          <input id="ctl-glitch-dur-num" type="number" min="0.1" max="2" step="0.1" value="0.4">
        </span>
      </label>
      <label>Ramp target ×
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-ramp-mult"     type="range"  min="1" max="8" step="0.5" value="4">
          <input id="ctl-ramp-mult-num" type="number" min="1" max="8" step="0.5" value="4">
        </span>
      </label>
      <label>Ramp duration s
        <span style="display:flex;align-items:center;gap:4px;">
          <input id="ctl-ramp-dur"     type="range"  min="0.5" max="6" step="0.5" value="2">
          <input id="ctl-ramp-dur-num" type="number" min="0.5" max="6" step="0.5" value="2">
        </span>
      </label>
      <label style="justify-content:center;gap:4px;">
        <button id="ctl-glitch-btn"
                style="background:#111;color:#00ff70;border:1px solid #00ff70;
                       font-family:'Courier New',monospace;font-size:10px;cursor:pointer;

<div id="hint">MATRIX RAIN / WEBGPU + TSL</div>

<script type="module">
  import { initMatrixRain }  from './matrix-rain-webgpu.js';
  import { PRESETS }         from './matrix-rain-presets.js';
  import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
  import { Vector3 }         from 'three/webgpu';

  // ── Load defaults from def.json ───────────────────────────────────────
  const defaults = await fetch('./def.json').then(r => r.json()).catch(() => ({}));

  // WebGL2 fallback is automatic — only show the overlay if init truly fails.
  const noWebGpu = document.getElementById('no-webgpu');

  // ── Init ──────────────────────────────────────────────────────────────
  const host = document.getElementById('rain-host');

  // Register a one-shot 'matrixrain:ready' listener that shows the backend badge.
  // Called before each initMatrixRain so re-inits also refresh the badge.
  function registerBadge() {
    const failTimer = setTimeout(() => noWebGpu.classList.remove('hidden'), 10000);
    host.addEventListener('matrixrain:ready', ({ detail }) => {
      clearTimeout(failTimer);
      let badge = document.getElementById('backend-badge');
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'backend-badge';
        badge.style.cssText =
          'position:fixed;bottom:8px;right:12px;font:11px/1 monospace;' +
          'color:rgba(0,255,112,0.4);pointer-events:none;z-index:9999;';
        document.body.appendChild(badge);
      }
      badge.textContent = detail.backend === 'webgpu' ? 'WebGPU' : 'WebGL2';
    }, { once: true });
  }

  registerBadge();
  let rain = initMatrixRain(host, {
    charSet:        defaults.charSet        ?? 'matrixcode',
    postProcessing: defaults.ppmode         ?? 'rain',
  });

  // ── Orbit controls ────────────────────────────────────────────────────
  let controls = null;
  function makeControls(rainHandle) {
    if (controls) controls.dispose();
    // Canvas has pointer-events:none so the controls panel stays interactive.
    // Attach OrbitControls to the host div instead; it receives all pointer events.
    controls = new OrbitControls(rainHandle.camera, host);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance   = 0.5;
    controls.maxDistance   = 20;
  }
  host.addEventListener('contextmenu', e => e.preventDefault());
  makeControls(rain);
  window._rain = rain;   // console: _rain.camera.position, _rain.camera.rotation
  window.campos = () => {
    const p = rain.camera.position;
    console.log(`camera: x=${p.x.toFixed(3)}  y=${p.y.toFixed(3)}  z=${p.z.toFixed(3)}`);
  };

  // ── WASD fly ──────────────────────────────────────────────────────────
  const _keys = {};
  document.addEventListener('keydown', e => {
    _keys[e.code] = true;
    if (e.code === 'KeyH' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const panel = document.getElementById('controls');
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
    }
    if (e.code === 'KeyM' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      document.getElementById('ctl-msg-show').click();
    }
  });
  document.addEventListener('keyup',   e => { _keys[e.code] = false; });

  const _fwd   = new Vector3();
  const _right = new Vector3();
  const MOVE_SPEED = 0.06;

  (function controlsLoop() {
    requestAnimationFrame(controlsLoop);
    if (!controls) return;
    const cam = rain.camera;
    cam.getWorldDirection(_fwd);
    _right.crossVectors(_fwd, cam.up).normalize();
    let dx = 0, dz = 0;
    if (_keys['KeyW'] || _keys['ArrowUp'])    dz =  1;
    if (_keys['KeyS'] || _keys['ArrowDown'])  dz = -1;
    if (_keys['KeyA'] || _keys['ArrowLeft'])  dx = -1;
    if (_keys['KeyD'] || _keys['ArrowRight']) dx =  1;
    const autoCamActive = document.getElementById('ctl-orbit')?.checked || document.getElementById('ctl-flythrough')?.checked;
    if (!autoCamActive && (dx || dz)) {
      const speed = (_keys['ShiftLeft'] || _keys['ShiftRight']) ? MOVE_SPEED * 2 : MOVE_SPEED;
      const delta = _fwd.clone().multiplyScalar(dz * speed).addScaledVector(_right, dx * speed);
      cam.position.add(delta);
      controls.target.add(delta);
    }
    controls.update();
  })();

  // ── PP mode switching ─────────────────────────────────────────────────
  // On mode change: preserve only charSet; all other params reset to defaults.
  // 'none' is a diagnostic mode — glyphs render without glow.
  const crtPanel  = document.getElementById('crt-controls');
  const ppmodeEl  = document.getElementById('ctl-ppmode');

  function updateCrtPanelVisibility(mode) {
    crtPanel.style.display = mode === 'crt' ? 'flex' : 'none';
  }

  ppmodeEl.addEventListener('change', () => {
    const newMode    = ppmodeEl.value;
    const currentSet = document.getElementById('ctl-charset').value;
    rain.destroy();
    // All existing control handlers close over the 'rain' let-variable and pick up the new value.
    registerBadge();
    rain = initMatrixRain(host, {
      charSet:        currentSet,
      postProcessing: newMode,
    });
    makeControls(rain);
    updateCrtPanelVisibility(newMode);
  });

  // ── Controls ──────────────────────────────────────────────────────────

  /**
   * Link a range slider and its numeric companion so edits to either
   * propagate to the other and fire the same onChange callback.
   *
   * @param {string}   rangeId   id of the <input type="range">
   * @param {string}   numId     id of the companion <input type="number">
   * @param {Function} onChange  called with the parsed float value on any change
   */
  function linkSlider(rangeId, numId, onChange) {
    const range = document.getElementById(rangeId);
    const num   = document.getElementById(numId);
    range.addEventListener('input', () => {
      num.value = range.value;
      onChange(parseFloat(range.value));
    });
    num.addEventListener('change', () => {
      const raw = parseFloat(num.value);
      if (isNaN(raw)) { num.value = range.value; return; }  // reject empty / non-numeric
      const v = Math.max(parseFloat(num.min), Math.min(parseFloat(num.max), raw));
      num.value   = v;
      range.value = v;
      onChange(v);
    });
  }

  function bind(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    const evName = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evName, () => fn(el.type === 'checkbox' ? el.checked : parseFloat(el.value)));
  }

  document.getElementById('ctl-color').addEventListener('input', () =>
    rain.setColor(document.getElementById('ctl-color').value)
  );
  document.getElementById('ctl-color2').addEventListener('input', () =>
    rain.setColor2(document.getElementById('ctl-color2').value)
  );
  linkSlider('ctl-speed',     'ctl-speed-num',     v => rain.setSpeed(v));
  linkSlider('ctl-bloom',     'ctl-bloom-num',     v => rain.setBloomStrength(v));
  linkSlider('ctl-bloom-thr', 'ctl-bloom-thr-num', v => rain.setBloomThreshold(v));
  linkSlider('ctl-opacity',   'ctl-opacity-num',   v => rain.setOpacity(v));
  linkSlider('ctl-depth',     'ctl-depth-num',     v => rain.setDepth(v));
  linkSlider('ctl-normal',    'ctl-normal-num',    v => rain.setNormalStrength(v));
  linkSlider('ctl-sway',      'ctl-sway-num',      v => rain.setSway(v));
  linkSlider('ctl-soften',    'ctl-soften-num',    v => rain.setSoften(true, v));
  linkSlider('ctl-heat',      'ctl-heat-num',      v => rain.setHeat(v > 0, v));
  linkSlider('ctl-streaks',   'ctl-streaks-num',   v => rain.setStreaks(v > 0, v));
  linkSlider('ctl-phosphor',  'ctl-phosphor-num',  v => rain.setPhosphorDecay(v));

  function godRaysFromUI() {
    const on       = document.getElementById('ctl-godrays').checked;
    const lightX   = parseFloat(document.getElementById('ctl-gr-lx').value);
    const lightY   = parseFloat(document.getElementById('ctl-gr-ly').value);
    const density  = parseFloat(document.getElementById('ctl-gr-density').value);
    const decay    = parseFloat(document.getElementById('ctl-gr-decay').value);
    const weight   = parseFloat(document.getElementById('ctl-gr-weight').value);
    const exposure = parseFloat(document.getElementById('ctl-gr-exposure').value);
    rain.setGodRays(on, lightX, lightY, density, decay, weight, exposure);
  }
  bind('ctl-godrays',    () => godRaysFromUI());
  linkSlider('ctl-gr-lx',      'ctl-gr-lx-num',      () => godRaysFromUI());
  linkSlider('ctl-gr-ly',      'ctl-gr-ly-num',      () => godRaysFromUI());
  linkSlider('ctl-gr-density', 'ctl-gr-density-num', () => godRaysFromUI());
  linkSlider('ctl-gr-decay',   'ctl-gr-decay-num',   () => godRaysFromUI());
  linkSlider('ctl-gr-weight',  'ctl-gr-weight-num',  () => godRaysFromUI());
  linkSlider('ctl-gr-exposure','ctl-gr-exposure-num',() => godRaysFromUI());

  bind('ctl-burst',        on => rain.setBurstBloom(on));
  bind('ctl-flatz',        on => rain.setFlatZ(on));
  linkSlider('ctl-yaw',          'ctl-yaw-num',          v  => rain.setMaxYaw(v));
  linkSlider('ctl-jitter',       'ctl-jitter-num',       v  => rain.setFacingJitter(v));
  linkSlider('ctl-chroma-scale', 'ctl-chroma-scale-num', v  => rain.setGlyphChroma(v > 0, v));
  linkSlider('ctl-vignette',   'ctl-vignette-num',   v => rain.setVignette(v));
  linkSlider('ctl-scanlines',  'ctl-scanlines-num',  v => rain.setScanlines(v));
  linkSlider('ctl-holo-aber',  'ctl-holo-aber-num',  v => rain.setHoloAberration(v));

  document.getElementById('ctl-charset').addEventListener('change', e => {
    rain.setCharSet(e.target.value);
  });

  // Message reveal buttons
  document.getElementById('ctl-msg-show').addEventListener('click', () => {
    rain.showMessage(document.getElementById('ctl-msg-text').value, {
      boost:          parseFloat(document.getElementById('ctl-msg-boost').value),
      spawnChance:    parseFloat(document.getElementById('ctl-msg-spawn').value),
      tolMultMin:     parseFloat(document.getElementById('ctl-msg-tolmult-min').value),
      tolMultMax:     parseFloat(document.getElementById('ctl-msg-tolmult-max').value),
      tolMinScale:    parseFloat(document.getElementById('ctl-msg-tolscale').value),
      revealDuration: parseFloat(document.getElementById('ctl-msg-reveal').value),
      holdDuration:   parseFloat(document.getElementById('ctl-msg-hold').value),
      fadeDuration:   parseFloat(document.getElementById('ctl-msg-fade').value),
    });
  });
  document.getElementById('ctl-msg-clear').addEventListener('click', () => {
    rain.clearMessage();
  });
  // Message sliders — sync range↔number, no live callback (values read on button click)
  linkSlider('ctl-msg-boost',    'ctl-msg-boost-num',    () => {});
  linkSlider('ctl-msg-spawn',    'ctl-msg-spawn-num',    () => {});
  linkSlider('ctl-msg-tolmult-min', 'ctl-msg-tolmult-min-num', () => {});
  linkSlider('ctl-msg-tolmult-max', 'ctl-msg-tolmult-max-num', () => {});
  linkSlider('ctl-msg-tolscale', 'ctl-msg-tolscale-num', () => {});
  linkSlider('ctl-msg-reveal',   'ctl-msg-reveal-num',   () => {});
  linkSlider('ctl-msg-hold',     'ctl-msg-hold-num',     () => {});
  linkSlider('ctl-msg-fade',     'ctl-msg-fade-num',     () => {});

  // CRT shader selector — rain.crt is null until renderer.init() resolves in 'crt' mode;
  // optional chaining makes these calls safe at any time.
  document.getElementById('ctl-crt-shader').addEventListener('change', e => {
    rain.crt?.setShader(e.target.value);
  });

  // Columns controls
  function pushSpeedRange() {
    rain.setSpeedRange(
      parseFloat(document.getElementById('ctl-spd-min').value),
      parseFloat(document.getElementById('ctl-spd-max').value),
    );
  }
  function pushTrailRange() {
    rain.setTrailRange(
      parseFloat(document.getElementById('ctl-trl-min').value),
      parseFloat(document.getElementById('ctl-trl-max').value),
    );
  }
  linkSlider('ctl-spd-min', 'ctl-spd-min-num', () => pushSpeedRange());

  function applySettings(s) {
    const el  = id => document.getElementById(id);
    // set() syncs both the range/select value and the companion number input (if present)
    const set = (id, v) => {
      if (v === undefined) return;
      el(id).value = v;
      const numEl = document.getElementById(id + '-num');
      if (numEl) numEl.value = v;
    };
    const chk = (id, v) => { if (v !== undefined) el(id).checked = v; };

    const prevMode = ppmodeEl.value;

    // ── Sync UI ──────────────────────────────────────────────────────────
    set('ctl-ppmode',        s.ppmode);
    set('ctl-charset',       s.charSet);
    set('ctl-crt-shader',    s.crtShader);
    set('ctl-color',         s.color);
    set('ctl-color2',        s.color2);
    set('ctl-opacity',       s.opacity);
    set('ctl-depth',         s.depth);
    set('ctl-normal',        s.normalStrength);
    set('ctl-sway',          s.sway);
    set('ctl-soften',        s.soften);
    set('ctl-heat',          s.heat);
    set('ctl-streaks',       s.streaks);
    set('ctl-speed',         s.speed);
    set('ctl-bloom',         s.bloomStrength);
    set('ctl-bloom-thr',     s.bloomThreshold);
    set('ctl-phosphor',      s.phosphorDecay);
    set('ctl-jitter',        s.facingJitter);
    set('ctl-chroma-scale',  s.glyphChromaScale);
    chk('ctl-burst',         s.burstBloom);
    chk('ctl-flatz',         s.flatZ);
    set('ctl-yaw',           s.maxYaw);
    set('ctl-vignette',      s.vignette);
    set('ctl-scanlines',     s.scanlines);
    set('ctl-holo-aber',     s.holoAberration);
    if (s.godRays) {
      const g = s.godRays;
      chk('ctl-godrays',    g.enabled);
      set('ctl-gr-lx',      g.lightX);
      set('ctl-gr-ly',      g.lightY);
      set('ctl-gr-density', g.density);
      set('ctl-gr-decay',   g.decay);
      set('ctl-gr-weight',  g.weight);
      set('ctl-gr-exposure',g.exposure);
    }
    set('ctl-brightness',  s.brightness);
    set('ctl-cellw',       s.cellW);
    set('ctl-cellh',       s.cellH);
    set('ctl-breath-amt',  s.breathAmt);
    set('ctl-wave-speed',  s.waveSpeed);
    set('ctl-wave-amt',    s.waveAmt);
    set('ctl-wave-crests', s.waveCrests);
    chk('ctl-weighted',    s.weightedGlyphs);
    set('ctl-reverse',     s.reverseChance);
    // Glyph FX
    set('ctl-drip',        s.drip);
    set('ctl-edge-glow',   s.edgeGlow);
    set('ctl-zrot',        s.zRot);
    set('ctl-grain',       s.filmGrain);
    set('ctl-depth-tint',  s.depthTint);
    chk('ctl-boot',        s.boot);
    set('ctl-stability',   s.stability);
    set('ctl-hold-mult',   s.holdMult);
    set('ctl-burst-rate',  s.burstGlyphRate);
    set('ctl-pom-steps',   s.pomSteps);
    set('ctl-hue-range',   s.hueRange);
    set('ctl-burst-prob',  s.burstProb);
    set('ctl-eol-flash',   s.eolFlash);
    set('ctl-eol-freeze',  s.eolFreezeStart);
    set('ctl-eol-fade',    s.eolFadeStart);

    // ── Rebuild if ppmode changed ────────────────────────────────────────
    if (s.ppmode !== undefined && s.ppmode !== prevMode) {
      rain.destroy();
      registerBadge();
      rain = initMatrixRain(host, {
        charSet:        s.charSet ?? el('ctl-charset').value,
        postProcessing: s.ppmode,
      });
      updateCrtPanelVisibility(s.ppmode);
    }

    // ── Push to live rain handle ─────────────────────────────────────────
    if (s.color          !== undefined) rain.setColor(s.color);
    if (s.color2         !== undefined) rain.setColor2(s.color2);
    if (s.opacity        !== undefined) rain.setOpacity(s.opacity);
    if (s.depth          !== undefined) rain.setDepth(s.depth);
    if (s.normalStrength !== undefined) rain.setNormalStrength(s.normalStrength);
    if (s.sway           !== undefined) rain.setSway(s.sway);
    if (s.soften         !== undefined) rain.setSoften(s.soften > 0, s.soften);
    if (s.heat           !== undefined) rain.setHeat(s.heat > 0, s.heat);
    if (s.streaks        !== undefined) rain.setStreaks(s.streaks > 0, s.streaks);
    if (s.speed          !== undefined) rain.setSpeed(s.speed);
    if (s.bloomStrength  !== undefined) rain.setBloomStrength(s.bloomStrength);
    if (s.bloomThreshold !== undefined) rain.setBloomThreshold(s.bloomThreshold);
    if (s.phosphorDecay  !== undefined) rain.setPhosphorDecay(s.phosphorDecay);
    if (s.facingJitter   !== undefined) rain.setFacingJitter(s.facingJitter);
    if (s.glyphChromaScale !== undefined) rain.setGlyphChroma(s.glyphChromaScale > 0, s.glyphChromaScale);
    if (s.burstBloom     !== undefined) rain.setBurstBloom(s.burstBloom);
    if (s.flatZ          !== undefined) rain.setFlatZ(s.flatZ);
    if (s.maxYaw         !== undefined) rain.setMaxYaw(s.maxYaw);
    if (s.vignette       !== undefined) rain.setVignette(s.vignette);
    if (s.scanlines      !== undefined) rain.setScanlines(s.scanlines);
    if (s.holoAberration !== undefined) rain.setHoloAberration(s.holoAberration);
    if (s.charSet        !== undefined) rain.setCharSet(s.charSet);
    if (s.godRays)                      godRaysFromUI();
    if (s.crtShader      !== undefined) rain.crt?.setShader(s.crtShader);
    if (s.brightness     !== undefined) rain.setBrightness(s.brightness);
    if (s.cellW          !== undefined || s.cellH !== undefined) rain.setCellSize(
      s.cellW ?? parseFloat(document.getElementById('ctl-cellw').value),
      s.cellH ?? parseFloat(document.getElementById('ctl-cellh').value),
    );
    if (s.breathAmt      !== undefined) rain.setBreathAmt(s.breathAmt);
    if (s.waveSpeed      !== undefined) rain.setWaveSpeed(s.waveSpeed);
    if (s.waveAmt        !== undefined) rain.setWaveAmt(s.waveAmt);
    if (s.waveCrests     !== undefined) rain.setWaveCrests(s.waveCrests);
    if (s.weightedGlyphs !== undefined) rain.setWeightedGlyphs(s.weightedGlyphs ? 1.0 : 0.0);
    if (s.reverseChance  !== undefined) rain.setReverseChance(s.reverseChance);
    // Glyph FX
    if (s.drip           !== undefined) rain.setDrip(s.drip);
    if (s.edgeGlow       !== undefined) rain.setEdgeGlow(s.edgeGlow);
    if (s.zRot           !== undefined) rain.setZRotation(s.zRot);
    if (s.filmGrain      !== undefined) rain.setFilmGrain(s.filmGrain);
    if (s.depthTint      !== undefined) rain.setDepthTint(s.depthTint);
    if (s.boot           !== undefined) rain.setStartupCascade(s.boot);
    if (s.stability      !== undefined) rain.setStability(s.stability);
    if (s.holdMult       !== undefined) rain.setHoldMult(s.holdMult);
    if (s.burstGlyphRate !== undefined) rain.setBurstGlyphRate(s.burstGlyphRate);
    if (s.pomSteps       !== undefined) rain.setPomSteps(s.pomSteps);
    if (s.hueRange       !== undefined) rain.setColorBlend(s.hueRange);
    if (s.burstProb      !== undefined) rain.setBurstProb(s.burstProb);
    if (s.eolFlash       !== undefined) rain.setEolFlash(s.eolFlash);
    if (s.eolFreezeStart !== undefined) rain.setEolFreezeStart(s.eolFreezeStart);
    if (s.eolFadeStart   !== undefined) rain.setEolFadeStart(s.eolFadeStart);

    set('ctl-spd-min',      s.spdMin);
    set('ctl-spd-max',      s.spdMax);
    set('ctl-trl-min',      s.trlMin);
    set('ctl-trl-max',      s.trlMax);
    set('ctl-density-3d',   s.density3d);
    set('ctl-zone-spd-in',  s.zoneSpeedIn);
    set('ctl-zone-spd-out', s.zoneSpeedOut);
    set('ctl-zone-br-in',   s.zoneBrIn);
    set('ctl-zone-br-out',  s.zoneBrOut);
    if (s.spdMin   !== undefined || s.spdMax   !== undefined) pushSpeedRange();
    if (s.trlMin   !== undefined || s.trlMax   !== undefined) pushTrailRange();
    if (s.density3d !== undefined) rain.setDensity(s.density3d);
    if (s.zoneSpeedIn !== undefined || s.zoneSpeedOut !== undefined) pushZoneSpeed();
    if (s.zoneBrIn    !== undefined || s.zoneBrOut    !== undefined) pushZoneBright();
    set('ctl-topology',       s.topology);
    chk('ctl-forward-facing', s.forwardFacing);
    set('ctl-ncols',          s.nCols);
    set('ctl-shell-in',       s.shellIn);
    set('ctl-shell-out',      s.shellOut);
    set('ctl-rect-w',         s.rectW);
    set('ctl-rect-h',         s.rectH);
    set('ctl-clusters',       s.clusters);
    set('ctl-cluster-spread', s.clusterSpread);
    set('ctl-radial-bias',    s.radialBias);
    set('ctl-density-in',     s.densityIn);
    set('ctl-density-out',    s.densityOut);
    set('ctl-cluster-uniform',     s.clusterUniform);
    set('ctl-cluster-bias',        s.clusterBias);
    set('ctl-cluster-speed-jitter', s.clusterSpeedJitter);
    set('ctl-cluster-y-spread',    s.clusterYSpread);
    set('ctl-cluster-r-jitter',    s.clusterRJitter);
    chk('ctl-sector-strength',  s.sectorStrength);
    set('ctl-sector-center',    s.sectorCenter);
    set('ctl-sector-width',     s.sectorWidth);
    set('ctl-height-fade',      s.heightFade);
    if (s.topology      !== undefined) { rain.setTopology(s.topology); updateDistControls(s.topology); }
    if (s.forwardFacing !== undefined) rain.setForwardFacing(s.forwardFacing);
    if (s.nCols         !== undefined) rain.setColumnCount(s.nCols);
    if (s.shellIn       !== undefined || s.shellOut       !== undefined) rain.setShellRadii(
      s.shellIn  ?? parseFloat(document.getElementById('ctl-shell-in').value),
      s.shellOut ?? parseFloat(document.getElementById('ctl-shell-out').value),
    );
    if (s.rectW         !== undefined || s.rectH         !== undefined) rain.setRectExtent(
      s.rectW ?? parseFloat(document.getElementById('ctl-rect-w').value),
      s.rectH ?? parseFloat(document.getElementById('ctl-rect-h').value),
    );
    if (s.clusters      !== undefined || s.clusterSpread  !== undefined) rain.setClusterParams(
      s.clusters      ?? parseFloat(document.getElementById('ctl-clusters').value),
      s.clusterSpread ?? parseFloat(document.getElementById('ctl-cluster-spread').value),
    );
    if (s.radialBias      !== undefined) rain.setRadialBias(s.radialBias);
    if (s.clusterUniform  !== undefined) rain.setClusterUniform(s.clusterUniform);
    if (s.clusterBias     !== undefined) rain.setClusterBias(s.clusterBias);
    if (s.clusterSpeedJitter !== undefined) rain.setClusterSpeedJitter(s.clusterSpeedJitter);
    if (s.clusterYSpread     !== undefined) rain.setClusterYSpread(s.clusterYSpread);
    if (s.clusterRJitter     !== undefined) rain.setClusterRJitter(s.clusterRJitter);
    if (s.densityIn     !== undefined || s.densityOut     !== undefined) rain.setRadialDensityTaper(
      s.densityIn  ?? parseFloat(document.getElementById('ctl-density-in').value),
      s.densityOut ?? parseFloat(document.getElementById('ctl-density-out').value),
    );
    if (s.sectorStrength !== undefined) rain.setSectorStrength(s.sectorStrength ? 1 : 0);
    if (s.sectorCenter   !== undefined) rain.setSectorCenter(s.sectorCenter);
    if (s.sectorWidth    !== undefined) rain.setSectorWidth(s.sectorWidth);
    if (s.heightFade     !== undefined) rain.setHeightFade(s.heightFade);
  }

  document.getElementById('ctl-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(collectSettings(), null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;  a.download = 'matrix-rain-settings.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('ctl-import-file');
  document.getElementById('ctl-import').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try { applySettings(JSON.parse(ev.target.result)); } catch { /* malformed JSON */ }
    };
    reader.readAsText(file);
    e.target.value = '';  // allow re-importing the same file
  });

  // ── Preset selector ───────────────────────────────────────────────────
  // ── Apply startup defaults ────────────────────────────────────────────
  if (Object.keys(defaults).length) {
    applySettings(defaults);
    updateCrtPanelVisibility(defaults.ppmode ?? 'rain');
  }

  document.getElementById('ctl-preset').addEventListener('change', e => {
    const name = e.target.value;
    if (!name) return;
    rain.applyPreset(name);
    // Sync UI controls to the applied preset values
    const p = PRESETS[name];
    if (!p) return;
    if (p.color           !== undefined) document.getElementById('ctl-color').value        = p.color;
    if (p.opacity         !== undefined) document.getElementById('ctl-opacity').value      = p.opacity;
    if (p.depth           !== undefined) document.getElementById('ctl-depth').value        = p.depth;
    if (p.normalStrength  !== undefined) document.getElementById('ctl-normal').value       = p.normalStrength;
    if (p.speed           !== undefined) document.getElementById('ctl-speed').value        = p.speed;
    if (p.bloomStrength   !== undefined) document.getElementById('ctl-bloom').value        = p.bloomStrength;
    if (p.bloomThreshold  !== undefined) document.getElementById('ctl-bloom-thr').value    = p.bloomThreshold;
    if (p.phosphorDecay   !== undefined) document.getElementById('ctl-phosphor').value     = p.phosphorDecay;
    if (p.heat            !== undefined) document.getElementById('ctl-heat').value         = p.heat;
    if (p.soften          !== undefined) document.getElementById('ctl-soften').value       = p.soften;
    if (p.streaks         !== undefined) document.getElementById('ctl-streaks').value      = p.streaks;
    if (p.burstBloom      !== undefined) document.getElementById('ctl-burst').checked      = p.burstBloom;
    if (p.vignette        !== undefined) document.getElementById('ctl-vignette').value     = p.vignette;
    if (p.scanlines       !== undefined) document.getElementById('ctl-scanlines').value    = p.scanlines;
    if (p.holoAberration  !== undefined) document.getElementById('ctl-holo-aber').value    = p.holoAberration;
    if (p.glyphChromaScale !== undefined) document.getElementById('ctl-chroma-scale').value = p.glyphChromaScale;
    if (p.charSet         !== undefined) document.getElementById('ctl-charset').value      = p.charSet;
    if (p.godRays) {
      const g = p.godRays;
      document.getElementById('ctl-godrays').checked  = g.enabled;
      if (g.lightX    !== undefined) document.getElementById('ctl-gr-lx').value      = g.lightX;
      if (g.lightY    !== undefined) document.getElementById('ctl-gr-ly').value      = g.lightY;
      if (g.density   !== undefined) document.getElementById('ctl-gr-density').value = g.density;
      if (g.decay     !== undefined) document.getElementById('ctl-gr-decay').value   = g.decay;
      if (g.weight    !== undefined) document.getElementById('ctl-gr-weight').value  = g.weight;
      if (g.exposure  !== undefined) document.getElementById('ctl-gr-exposure').value = g.exposure;
    }
  });

  // ══════════════════════════════════════════════════════════════════════
  // CCP EASTER EGG — demo-side JS
  // ══════════════════════════════════════════════════════════════════════

  // ── Demo-local state ──────────────────────────────────────────────────
  let _ccpEnabled  = false;  // mirrors library _ccpActive for DOM animation guards
  let _ccpScore    = 0;
  let _ccpHudTimer = null;
  let _sweepRafId  = null;
  let _mx = 0, _my = 0;

  document.addEventListener('mousemove', e => { _mx = e.clientX; _my = e.clientY; });

  // ── HUD ───────────────────────────────────────────────────────────────
  function _startHUD() {
    _ccpScore = 700 + Math.floor(Math.random() * 200);
    document.getElementById('ccp-score').textContent      = _ccpScore;
    document.getElementById('ccp-score-display').textContent = _ccpScore;
    document.getElementById('ccp-hud').style.display = 'flex';
    _ccpHudTimer = setInterval(() => {
      _ccpScore++;
      document.getElementById('ccp-score').textContent      = _ccpScore;
      document.getElementById('ccp-score-display').textContent = _ccpScore;
      const now = new Date();
      document.getElementById('ccp-time').textContent = now.toTimeString().slice(0, 8);
    }, 2000);
  }

  function _stopHUD() {
    clearInterval(_ccpHudTimer);
    _ccpHudTimer = null;
    document.getElementById('ccp-hud').style.display = 'none';
  }

  // HUD coord update
  setInterval(() => {
    if (!_ccpEnabled) return;
    document.getElementById('ccp-coords').textContent =
      '(X:' + String(_mx).padStart(4,'0') + ' Y:' + String(_my).padStart(4,'0') + ')';
  }, 100);

  // ── Censorship sweep bars ──────────────────────────────────────────────
  const _sweepPhase  = [0.0, 0.5];
  const SWEEP_PERIOD = 11000;

  function _animateSweep(now) {
    if (!_ccpEnabled) return;
    for (let i = 0; i < 2; i++) {
      const t   = ((now % SWEEP_PERIOD) / SWEEP_PERIOD + _sweepPhase[i]) % 1.0;
      const pct = t * 105 - 2;
      document.getElementById('ccp-sweep-' + i).style.top = pct + 'vh';
    }
    _sweepRafId = requestAnimationFrame(_animateSweep);
  }

  function _startSweep() {
    document.querySelectorAll('.ccp-sweep').forEach(el => el.style.display = 'block');
    _sweepRafId = requestAnimationFrame(_animateSweep);
  }

  function _stopSweep() {
    cancelAnimationFrame(_sweepRafId);
    _sweepRafId = null;
    document.querySelectorAll('.ccp-sweep').forEach(el => el.style.display = 'none');
  }

  // ── National anthem audio ──────────────────────────────────────────────
  const _anthemAudio = new Audio('data/ccp-anthem.mp3');
  _anthemAudio.loop = true;
  _anthemAudio.volume = 0.8;

  function _stopAllCCPAudio() {
    _anthemAudio.pause();
    _anthemAudio.currentTime = 0;
    document.getElementById('ccp-audio').checked = false;
  }

  // ── CCP panel control wiring ───────────────────────────────────────────
  function _linkSliderCCP(rangeId, numId, fn) {
    const range = document.getElementById(rangeId);
    const num   = document.getElementById(numId);
    if (!range || !num) return;
    range.addEventListener('input', e => { num.value = e.target.value; fn(parseFloat(e.target.value)); });
    num.addEventListener('input',   e => { range.value = e.target.value; fn(parseFloat(e.target.value)); });
  }

  _linkSliderCCP('ccp-flash-rate',   'ccp-flash-rate-num',   v => rain.setCCPFlashRate(v));
  _linkSliderCCP('ccp-opacity',      'ccp-opacity-num',      v => rain.setCCPOpacity(v));
  _linkSliderCCP('ccp-scale',        'ccp-scale-num',        v => rain.setCCPScale(v));
  _linkSliderCCP('ccp-orbit-speed',  'ccp-orbit-speed-num',  v => rain.setCCPOrbitSpeed(v));
  _linkSliderCCP('ccp-tint-opacity', 'ccp-tint-opacity-num', v => {
    document.getElementById('ccp-tint').style.background = 'rgba(222, 41, 16, ' + v + ')';
  });

  document.getElementById('ccp-panel-count').addEventListener('change', e =>
    rain.setCCPPanelCount(parseInt(e.target.value, 10)));

  document.getElementById('ccp-rain-override').addEventListener('change', e =>
    rain.setCCPRainOverride(e.target.checked));

  document.getElementById('ccp-slogans').addEventListener('change', e =>
    rain.setCCPSlogans(e.target.checked));

  document.getElementById('ccp-audio').addEventListener('change', e => {
    if (e.target.checked && _ccpEnabled) {
      _anthemAudio.play().catch(() => {});
    } else {
      _anthemAudio.pause();
    }
  });

  document.getElementById('ccp-deduct').addEventListener('click', () => {
    _ccpScore = Math.max(0, _ccpScore - 50);
    document.getElementById('ccp-score').textContent      = _ccpScore;
    document.getElementById('ccp-score-display').textContent = _ccpScore;
    const hud = document.getElementById('ccp-hud');
    hud.style.borderColor = '#ff0000';
    hud.style.color       = '#ff0000';
    setTimeout(() => {
      hud.style.borderColor = '#DE2910';
      hud.style.color       = '#ff4040';
    }, 800);
  });

  document.getElementById('ccp-disable').addEventListener('click', () => {
    _ccpEnabled = false;
    rain.setCCPMode(false);
    document.getElementById('ccp-panel').style.display = 'none';
    _stopHUD();
    _stopSweep();
    _stopAllCCPAudio();
    document.getElementById('ccp-tint').style.display = 'none';
    // show hint
    const hint     = document.getElementById('hint');
    const prevText = hint.textContent;
    const prevCol  = hint.style.color;
    hint.textContent = '[ CCP MODE DEACTIVATED ]';
    hint.style.color   = '#ff2020';
    hint.style.opacity = '0.9';
    setTimeout(() => {
      hint.textContent = prevText;
      hint.style.color   = prevCol;
      hint.style.opacity = '0.35';
    }, 2000);
  });

  // ── Keylogger ──────────────────────────────────────────────────────────
  let _kbuf   = '';
  let _kTimer = null;

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return;
    _kbuf = (_kbuf + e.key.toLowerCase()).slice(-9);
    clearTimeout(_kTimer);
    _kTimer = setTimeout(() => { _kbuf = ''; }, 3000);
    if (_kbuf === 'xijinping') {
      _kbuf = '';
      _ccpEnabled = !_ccpEnabled;
      rain.setCCPMode(_ccpEnabled);
      const ccpPanelEl = document.getElementById('ccp-panel');
      if (_ccpEnabled) {
        ccpPanelEl.style.display = 'flex';
        _startHUD();
        _startSweep();
        document.getElementById('ccp-tint').style.display = 'block';
        document.getElementById('ccp-audio').checked = true;
        _anthemAudio.currentTime = 0;
        _anthemAudio.play().catch(() => {});
        // Sync camera controls UI: enable orbit, disable flythrough
        document.getElementById('ctl-orbit').checked = true;
        const ftEl = document.getElementById('ctl-flythrough');
        if (ftEl) ftEl.checked = false;
      } else {
        ccpPanelEl.style.display = 'none';
        _stopHUD();
        _stopSweep();
        _stopAllCCPAudio();
        document.getElementById('ccp-tint').style.display = 'none';
      }
      const hint     = document.getElementById('hint');
      const prevText = hint.textContent;
      const prevCol  = hint.style.color;
      hint.textContent = _ccpEnabled ? '[ CCP MODE ACTIVATED ]' : '[ CCP MODE DEACTIVATED ]';
      hint.style.color   = '#ff2020';
      hint.style.opacity = '0.9';
      setTimeout(() => {
        hint.textContent = prevText;
        hint.style.color   = prevCol;
        hint.style.opacity = '0.35';
      }, 2000);
    }
  });

</script>
</body>
</html>
