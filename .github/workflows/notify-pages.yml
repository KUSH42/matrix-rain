name: Notify GitHub Pages

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KUSH42.github.io deploy
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PAGES_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/KUSH42/KUSH42.github.io/dispatches \
            -d '{"event_type":"matrix-rain-updated"}'
