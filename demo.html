<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Matrix Rain — WebGPU + TSL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #00ff70;
    }

    #rain-host {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* ── Controls panel ──────────────────────────────────────────── */
    #controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #00ff70;
      padding: 14px 16px;
      min-width: 220px;
      font-size: 11px;
      letter-spacing: 0.07em;
      line-height: 1.9;
    }

    #controls summary {
      cursor: pointer;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #00ff70;
      list-style: none;
      user-select: none;
    }
    #controls summary::before { content: '▶ '; }
    details[open] summary::before { content: '▼ '; }

    #controls label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
      color: #7fffaa;
    }

    #controls input[type="range"] {
      width: 90px;
      accent-color: #00ff70;
    }
    #controls input[type="color"] {
      width: 32px;
      height: 18px;
      padding: 0;
      border: 1px solid #00ff70;
      background: transparent;
      cursor: pointer;
    }
    #controls input[type="checkbox"] {
      accent-color: #00ff70;
    }

    #no-webgpu {
      position: fixed;
      inset: 0;
      background: #000;
      color: #f00;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 16px;
      font-family: monospace;
      z-index: 9999;
    }
    #no-webgpu.hidden { display: none; }

    #hint {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 10px;
      color: rgba(0, 255, 112, 0.35);
      letter-spacing: 0.08em;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
      "three/webgpu":   "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
      "three/tsl":      "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div id="no-webgpu">
  <strong>WebGPU not available</strong>
  <small>Try Chrome 113+ or Edge 113+ with a compatible GPU</small>
</div>

<div id="rain-host"></div>

<details id="controls">
  <summary>Matrix Rain</summary>
  <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">

    <label>Color
      <input id="ctl-color" type="color" value="#00ff70">
    </label>

    <label>Opacity
      <input id="ctl-opacity" type="range" min="0" max="1" step="0.01" value="0.82">
    </label>

    <label>Depth (POM)
      <input id="ctl-depth" type="range" min="0" max="0.15" step="0.005" value="0.04">
    </label>

    <label>Normal Str
      <input id="ctl-normal" type="range" min="0" max="12" step="0.5" value="6">
    </label>

    <label>Soften
      <input id="ctl-soften" type="range" min="0" max="0.01" step="0.0005" value="0.002">
    </label>

    <label>Heat shimmer
      <input id="ctl-heat" type="range" min="0" max="0.012" step="0.0005" value="0.004">
    </label>

    <label>Lens streaks
      <input id="ctl-streaks" type="range" min="0" max="0.2" step="0.005" value="0.055">
    </label>

    <label>Speed
      <input id="ctl-speed" type="range" min="0.1" max="4" step="0.05" value="1">
    </label>

    <label>Bloom strength
      <input id="ctl-bloom" type="range" min="0" max="3" step="0.05" value="1.15">
    </label>

    <label>Phosphor decay
      <input id="ctl-phosphor" type="range" min="0" max="0.99" step="0.01" value="0.88">
    </label>

    <label>God rays
      <input id="ctl-godrays" type="checkbox" checked>
    </label>

    <label>GR light X
      <input id="ctl-gr-lx" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>

    <label>GR light Y
      <input id="ctl-gr-ly" type="range" min="0" max="1" step="0.01" value="0.75">
    </label>

    <label>GR density
      <input id="ctl-gr-density" type="range" min="0" max="1" step="0.01" value="0.93">
    </label>

    <label>GR decay
      <input id="ctl-gr-decay" type="range" min="0" max="1" step="0.01" value="0.96">
    </label>

    <label>GR weight
      <input id="ctl-gr-weight" type="range" min="0" max="1" step="0.01" value="0.35">
    </label>

    <label>GR exposure
      <input id="ctl-gr-exposure" type="range" min="0" max="2" step="0.01" value="0.45">
    </label>

    <label>Burst bloom
      <input id="ctl-burst" type="checkbox" checked>
    </label>

    <label>Globe interact
      <input id="ctl-globe" type="checkbox" checked>
    </label>

    <label>Flat Z (2D plane)
      <input id="ctl-flatz" type="checkbox">
    </label>

    <label>Yaw aligned
      <input id="ctl-yaw" type="checkbox">
    </label>

    <label>Facing jitter
      <input id="ctl-jitter" type="range" min="0" max="1.5708" step="0.01" value="0.1745">
    </label>

    <label>Glyph chroma
      <input id="ctl-chroma" type="checkbox" checked>
    </label>

    <label>Chroma scale
      <input id="ctl-chroma-scale" type="range" min="0" max="3" step="0.05" value="1">
    </label>

  </div>
</details>

<div id="hint">MATRIX RAIN / WEBGPU + TSL</div>

<script type="module">
  import { initMatrixRain } from './matrix-rain-webgpu.js';

  // ── WebGPU check ──────────────────────────────────────────────────────
  const noWebGpu = document.getElementById('no-webgpu');
  if (!navigator.gpu) {
    noWebGpu.classList.remove('hidden');
  } else {
    noWebGpu.classList.add('hidden');
  }

  // ── Init ──────────────────────────────────────────────────────────────
  const host = document.getElementById('rain-host');
  const rain = initMatrixRain(host, {
    color:     '#00ff70',
    opacity:    0.82,
    atlasPath: './data/matrixcode_msdf.png',
  });

  // ── Controls ──────────────────────────────────────────────────────────
  function bind(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    const evName = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evName, () => fn(el.type === 'checkbox' ? el.checked : parseFloat(el.value)));
  }

  bind('ctl-color',    v  => rain.setColor(document.getElementById('ctl-color').value));
  document.getElementById('ctl-color').addEventListener('input', () =>
    rain.setColor(document.getElementById('ctl-color').value)
  );
  bind('ctl-speed',    v  => rain.setSpeed(v));
  bind('ctl-bloom',    v  => rain.setBloomStrength(v));
  bind('ctl-opacity',  v  => rain.setOpacity(v));
  bind('ctl-depth',    v  => rain.setDepth(v));
  bind('ctl-normal',   v  => rain.setNormalStrength(v));
  bind('ctl-soften',   v  => rain.setSoften(true, v));
  bind('ctl-heat',     v  => rain.setHeat(v > 0, v));
  bind('ctl-streaks',  v  => rain.setStreaks(v > 0, v));
  bind('ctl-phosphor', v  => rain.setPhosphorDecay(v));
  function godRaysFromUI() {
    const on       = document.getElementById('ctl-godrays').checked;
    const lightX   = parseFloat(document.getElementById('ctl-gr-lx').value);
    const lightY   = parseFloat(document.getElementById('ctl-gr-ly').value);
    const density  = parseFloat(document.getElementById('ctl-gr-density').value);
    const decay    = parseFloat(document.getElementById('ctl-gr-decay').value);
    const weight   = parseFloat(document.getElementById('ctl-gr-weight').value);
    const exposure = parseFloat(document.getElementById('ctl-gr-exposure').value);
    rain.setGodRays(on, lightX, lightY, density, decay, weight, exposure);
  }
  bind('ctl-godrays',    () => godRaysFromUI());
  bind('ctl-gr-lx',      () => godRaysFromUI());
  bind('ctl-gr-ly',      () => godRaysFromUI());
  bind('ctl-gr-density', () => godRaysFromUI());
  bind('ctl-gr-decay',   () => godRaysFromUI());
  bind('ctl-gr-weight',  () => godRaysFromUI());
  bind('ctl-gr-exposure',() => godRaysFromUI());

  function chromaFromUI() {
    const on    = document.getElementById('ctl-chroma').checked;
    const scale = parseFloat(document.getElementById('ctl-chroma-scale').value);
    rain.setGlyphChroma(on, scale);
  }
  bind('ctl-burst',        on => rain.setBurstBloom(on));
  bind('ctl-globe',        on => rain.setGlobeInteract(on));
  bind('ctl-flatz',        on => rain.setFlatZ(on));
  bind('ctl-yaw',          on => rain.setYawAligned(on ? 1.0 : 0.0));
  bind('ctl-jitter',       v  => rain.setFacingJitter(v));
  bind('ctl-chroma',       () => chromaFromUI());
  bind('ctl-chroma-scale', () => chromaFromUI());
</script>
</body>
</html>
